# Alice Runtime 推荐配置
#
# 这里放“人类部署者会理解、会主动修改”的非敏感配置。
# 密钥、手机号、Telegram hash 等 secret 放在 .env，再通过 *_env 字段引用。
# 高级控制参数留在代码默认值里；看不懂的参数不应该出现在默认配置里。

[telegram]
# 从 https://my.telegram.org/apps 获取。属于账号关联凭据，放在 .env。
api_id_env = "TELEGRAM_API_ID"
api_hash_env = "TELEGRAM_API_HASH"
phone_env = "TELEGRAM_PHONE"

# Telegram 用户 ID，用于管理员权限和默认 operator channel 推导。
admin_env = "TELEGRAM_ADMIN"

# Alice 发送晨报/周报等系统消息的目标。空字符串时使用 TELEGRAM_ADMIN 推导。
operator_channel_id = ""

[qq]
# ADR-264/265: QQ 第一接入只走 OneBot v11。
# 指向 NapCat/LLOneBot 等 OneBot 实现端的 HTTP action API，例如 http://127.0.0.1:3000
# 空字符串表示禁用 QQ transport；启用后 Alice stable id 仍使用 channel:qq:<群号> / contact:qq:<QQ号>。
onebot_api_base_url = ""

# OneBot v11 事件 WebSocket。指向 NapCat/LLOneBot 事件端点，例如 ws://127.0.0.1:3001。
# 空字符串表示禁用 QQ 入站。
onebot_event_ws_url = ""
onebot_access_token_env = ""
onebot_timeout_ms = 10000
onebot_reconnect_min_ms = 1000
onebot_reconnect_max_ms = 60000

# ── Claude через локальный прокси (Max-подписка, OAuth, без API-ключа) ──
# Все эндпоинты смотрят в claude-proxy (см. _study/claude-proxy). Прокси внутри
# гоняет официальный `claude` CLI. api_key_env=LLM_API_KEY должен быть НЕ пустым
# (openai-клиент требует строку) — поставь в .env: LLM_API_KEY=dummy.
# Имя model ("sonnet"/"haiku") важно: прокси по нему выбирает alias, а
# instructor-client.ts по нему включает MD_JSON режим.

[[llm.endpoints]]
name = "claude-sonnet"
base_url = "http://127.0.0.1:8787/v1"
api_key_env = "LLM_API_KEY"
model = "sonnet"

[[llm.endpoints]]
name = "claude-haiku"
base_url = "http://127.0.0.1:8787/v1"
api_key_env = "LLM_API_KEY"
model = "haiku"

# Opus — для ops-триажа и код-анализа в работач (см. ops_* маршруты ниже).
# Прокси понимает model="opus" (instructor-client.ts).
[[llm.endpoints]]
name = "claude-opus"
base_url = "http://127.0.0.1:8787/v1"
api_key_env = "LLM_API_KEY"
model = "opus"

[llm.routing]
# Мозг на sonnet (богаче/живее ответы). Латентность ок благодаря чистой cwd в прокси
# (CLI больше не грузит контекст Astracore) + BLOCK_TIMEOUT_MS=120с. Если будет
# упираться в таймаут — верни "claude-haiku".
first_pass = ["claude-sonnet"]
tool_tick = ["claude-sonnet"]

# Живые тики работач — на sonnet (надёжно, без таймаутов). Опус НЕ тянет большой
# живой промпт (контекст+история) → уходил за таймаут и ронял тики. Опус для
# код-анализа вынесен в отдельный task-tool с ЧИСТЫМ контекстом (только задача).
ops_first_pass = ["claude-sonnet"]
ops_tool_tick = ["claude-sonnet"]

# Eval/校准：офлайн, можно на haiku (дешевле/быстрее, не жжём ради тестов).
eval = ["claude-haiku"]

# 辅助модель组：旁路判断 / low-risk probe / лёгкие сводки.
auxiliary = ["claude-haiku"]

# 内省/反思：не面向 пользователя, haiku достаточно.
reflect = ["claude-haiku"]

[vision]
# Vision ВКЛЮЧЁН через нативный multimodal Claude (прокси шлёт картинку как content-блок
# через stream-json — Claude видит её напрямую за один проход, ~5с, без таймаутов).
# Алиса присылает статичный кадр/превью (для анимированных стикеров/видео — один кадр).
model = "sonnet"
base_url = "http://127.0.0.1:8787/v1"
max_per_tick = 5

[tts]
# Голос через локальный edge-tts шим (бесплатно, без ключа). См. _study/claude-proxy/tts_proxy.py.
# Запуск: _study/claude-proxy/start-tts.ps1 (порт 5123). Голос задаётся в шиме (TTS_PROXY_VOICE),
# поля model/voice/group_id шим игнорирует. Нужен ffmpeg в PATH (Alice конвертит MP3→OGG).
base_url = "http://127.0.0.1:5123"
api_key_env = "TTS_API_KEY"
model = "speech-02-hd"
voice = "edge"
group_id_env = "TTS_GROUP_ID"

[asr]
# Слух Алисы: локальный whisper-шим (faster-whisper, бесплатно, без ключа, на GPU).
# Запуск: _study/claude-proxy/start-asr.ps1 (порт 5124). Модель/устройство задаются в
# asr_proxy.py или .env-tts (WHISPER_MODEL=large-v3, WHISPER_DEVICE=cuda). Алиса шлёт
# сюда OGG/Opus голосовые и получает текст. Нужен ASR_API_KEY (любой непустой, dummy) в .env.
base_url = "http://127.0.0.1:5124/v1"
api_key_env = "ASR_API_KEY"
model = "whisper-1"

[services]
# 外部搜索。空 secret 时禁用 browse。
exa_api_key_env = "EXA_API_KEY"

# NeteaseCloudMusicApi 兼容端点。空字符串表示禁用音乐推荐。
music_api_base_url = ""

# YouTube Data API。空 secret 时禁用视频搜索。
youtube_api_key_env = ""

# 本地视觉辅助服务。通常不用改；服务不可用时会自动降级。
wd_tagger_url = "http://127.0.0.1:39100"
anime_classify_url = "http://127.0.0.1:39101"

[soul]
# Alice 的人格核心。default = SOUL.md；ojou = SOUL.ojou.md。
profile = "default"

[time]
# 用户所在时区，UTC+8 写 8，日本写 9。Ташкент (Узбекистан) = UTC+5。
timezone_offset = 5

[dormant]
# 安静窗口，本地小时。默认 23:00-07:00。
quiet_window_start = 23
quiet_window_end = 7

[focus]
# 焦点白名单：限制 Alice 主动分配注意力、IAUS 候选和跨聊天目标解析。
#
# 推荐写法：写系统里的 canonical target id，也就是 channel:<platform>:<native-id>。
# 例：
# - Telegram 群 / supergroup: "channel:telegram:-1001234567890"
# - Telegram 私聊: "channel:telegram:7785440246"
# - QQ 群: "channel:qq:123456789"
#
# 兼容写法：Telegram 可以只写原生数字 chat ID，运行时会归一化：
# - "-1001234567890" -> "channel:telegram:-1001234567890"
# - "7785440246" -> "channel:telegram:7785440246"
#
# 不要写：
# - 群名、用户名、@handle、t.me 链接
# - 旧内部格式 "channel:-1001234567890"
# - 带空格、逗号或其他说明文字的 ID
#
# 注意：whitelist = [] 不是“拒绝所有群”，而是“未配置内联白名单”。
# 当 whitelist 为空时，运行时会继续尝试读取 whitelist_path；
# 如果 whitelist_path 也为空，则尝试读取 ALICE_STATE_DIR/focus-whitelist.txt；
# 这些都没有时，白名单关闭，Alice 会看到所有已知聊天。
# whitelist = [
#   "channel:telegram:-1001234567890",
#   "channel:telegram:7785440246",
# ]
# Пусто = БЕЗ ограничения по группам: Алиса может работать в ЛЮБОЙ группе/канале.
# Доступ к ЛИЧКЕ ограничен в коде (events.ts): приватные чаты — только личка админа
# (TELEGRAM_ADMIN), чужие ЛС и её «Избранное»/Saved Messages игнорируются.
# Если захочешь снова запереть её на конкретные чаты — впиши сюда "channel:telegram:<id>".
whitelist = []

# 如果 whitelist 为空，也可以从文件读取。文件内容一行一个 target id：
#   channel:telegram:-1001234567890
#   channel:telegram:7785440246
# 行尾可以写 # 注释。空字符串时自动读取 ALICE_STATE_DIR/focus-whitelist.txt（存在才启用）。
whitelist_path = ""

[log]
level = "info"
